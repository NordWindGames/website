name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Same repository variable as the deploy workflow, so PR builds go
          # through the exact same code path. Empty on forks — the tag is
          # optional, so the build still succeeds.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

      - name: Blog gate
        # content/ideas/backlog.json is gitignored (privacy — see .gitignore), so it does not
        # exist on this checkout. blog-check.mjs skips that one gate with a note instead of
        # failing; inventory, conventions and images still run against every checked-in post.
        run: npm run blog:check
